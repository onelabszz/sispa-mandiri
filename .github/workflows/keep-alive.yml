name: Keep Supabase Alive

on:
  schedule:
    # Berjalan otomatis setiap 3 hari sekali (pukul 00:00 UTC)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Memungkinkan Anda menjalankannya secara manual dari tab Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Database Supabase
        env:
          # Ganti URL di bawah ini dengan URL Supabase Anda (tanpa garis miring di akhir)
          SUPABASE_URL: "https://oaasilmxpvxcsnfiqbbx.supabase.co"
          # Ganti dengan Anon Key / Publishable Key Anda
          SUPABASE_KEY: "sb_publishable_Yqd8cJ7uh08s4rstg_rJ3w_ETz1JkT2"
        run: |
          echo "Mengirim ping ke Supabase agar tidak di-pause..."
          
          # Melakukan query ringan ke tabel sekolah (mengambil 1 baris data)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/sekolah?select=npsn&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          
          echo "Respon dari Supabase: HTTP $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Berhasil! Supabase merespon dengan baik. Database tetap aktif."
          else
            echo "⚠️ Gagal terhubung atau ada masalah dengan database. Cek status Supabase Anda."
            exit 1
          fi
